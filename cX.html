<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>CʀɪᴄxCʀᴀᴛᴇ Lɪᴠᴇ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Acme&family=Amaranth:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#0D0E10;--olive:#7E8F6A;--ink:#F4F6F8;--muted:#9FA6AD;--accent:#3399ff;--danger:#ff4d4d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.gate-wrap{width:100%;max-width:440px;padding:3px;background:linear-gradient(145deg,var(--danger),#0088cc,var(--olive));border-radius:28px;box-shadow:0 25px 80px rgba(0,136,204,.35),0 15px 40px rgba(0,0,0,.65)}
.gate-box{background:#0D0E10;border-radius:25px;padding:36px 28px;text-align:center;border:1px solid rgba(255,255,255,.1)}
.badge{display:inline-block;padding:6px 12px;border-radius:999px;background:rgba(255,77,77,.14);border:1px solid rgba(255,77,77,.45);color:#ff8080;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-bottom:14px}
.gate-title{color:var(--ink);font-family:'Acme',sans-serif;font-size:34px;letter-spacing:.4px;margin-bottom:10px}
.gate-text{color:var(--muted);font-size:15px;line-height:1.55;margin-bottom:24px}
.gate-text b{color:var(--ink);font-family:'Amaranth',sans-serif;font-size:19px;display:block;margin-top:6px}
.join-btn{display:block;width:100%;padding:18px 20px;border-radius:18px;font:700 20px 'Amaranth',sans-serif;letter-spacing:.8px;color:#fff;text-decoration:none;background:linear-gradient(135deg,#0088cc,var(--olive));box-shadow:0 14px 40px rgba(0,136,204,.45)}
.sub-note{margin-top:14px;font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<div class="gate-wrap">
  <div class="gate-box">
    <div class="badge">Must Join Telegram</div>
    <h1 class="gate-title">Telegram Channel Required</h1>
    <p class="gate-text">
      Access to this stream is restricted. You must join our Telegram channel to continue.
      <b>Redirecting you to Telegram...</b>
    </p>
    <a class="join-btn" id="tgLink" href="https://t.me/+8Bfvj-fZZbw3ODE9" rel="noopener">JOIN TELEGRAM NOW</a>
    <p class="sub-note" id="statusText">If redirect does not start automatically, tap the button above.</p>
  </div>
</div>

<script>
"use strict";
const TG_REDIRECT_URL = "https://t.me/+8Bfvj-fZZbw3ODE9";

(function redirectToTelegram(){
  const linkEl = document.getElementById("tgLink");
  if(linkEl){
    linkEl.href = TG_REDIRECT_URL;
  }
  setTimeout(() => {
    window.location.replace(TG_REDIRECT_URL);
  }, 400);
})();
</script>
</body>
</html>
