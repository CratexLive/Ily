<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050505">
<title>Secure DRM Stream Player</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&amp;family=Amaranth:wght@400;700&amp;family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

<!-- Shaka Player CDN -->
<link rel="dns-prefetch" href="//cdn.jsdelivr.net">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin="">
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.compiled.js" as="script" crossorigin="anonymous"></script>

<style>
:root{
  --rktv-cyan: #00e5ff;
  --rktv-blue: #0077ff;
  --rktv-brightness: 1;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;background:#050505;overflow:hidden;
  font-family:'Poppins',system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  color:#fff;
}

/* Loading Overlay */
#overlay{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%,#050a12 0%,#050505 70%);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.loader-core{width:50px;height:50px;border:4px solid rgba(0,229,255,.1);border-top-color:var(--rktv-cyan);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
#overlay p{color:#00e5ff;font-size:13px;letter-spacing:1px;text-align:center;font-weight:600;text-transform:uppercase}

/* Status Toast */
#status{position:fixed;bottom:calc(66px + env(safe-area-inset-bottom,0px));left:12px;z-index:9997;display:flex;align-items:center;gap:7px;padding:6px 14px;background:rgba(9,9,11,.94);border:1px solid rgba(255,255,255,.1);border-radius:24px;font-size:10px;font-weight:700;text-transform:uppercase;pointer-events:none;opacity:0;transition:opacity .2s;}
#status.show{opacity:1}
.st-dot{width:6px;height:6px;border-radius:50%;}
#status.ok{color:#00e5ff;} #status.ok .st-dot{background:#00e5ff;}
#status.warn{color:#fb923c;} #status.warn .st-dot{background:#fb923c;}
#status.err{color:#f87171;} #status.err .st-dot{background:#f87171;}

/* Player Wrapper */
#pc{
  position:fixed;inset:0;background:#03070d;
  display:flex;align-items:center;justify-content:center;
  touch-action:manipulation;z-index:999;
  isolation:isolate;
}

/* Video Loader */
#stream-loader {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  overflow: hidden;
  pointer-events: none;
  background: radial-gradient(circle at 50% 45%, rgba(0,119,255,.13), transparent 55%), linear-gradient(145deg,#07121d,#020407);
  opacity: 1;
  visibility: visible;
  transition: opacity .45s ease, visibility .45s ease;
}
#stream-loader::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(110deg, transparent 35%, rgba(0,229,255,.055) 50%, transparent 65%);
  transform: translateX(-100%);
  animation: rktvLoadingShimmer 2.5s infinite;
}
@keyframes rktvLoadingShimmer {
  to { transform: translateX(100%); }
}
#stream-loader.hidden {
  opacity: 0;
  visibility: hidden;
}
.stream-spinner {
  width: 46px;
  height: 46px;
  border: 3px solid rgba(0,229,255,.12);
  border-top-color: #00e5ff;
  border-right-color: #0077ff;
  border-radius: 50%;
  animation: spin .85s linear infinite;
}
.stream-loader-text {
  color: #00e5ff;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.6px;
  text-transform: uppercase;
}

video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: transparent;
  outline: none;
  opacity: 0;
  filter: brightness(var(--rktv-brightness));
  transition: opacity .45s ease, filter 0.05s linear;
}
video.video-loaded { opacity: 1; }

/* Custom Controls Overlay */
#rktv-controls{position:absolute;bottom:0;left:0;right:0;z-index:20;transition:opacity .3s,transform .3s;padding:40px 0 7px;background:linear-gradient(to top, rgba(0,0,0,.9) 0%, rgba(0,0,0,.6) 40%, rgba(0,0,0,0) 100%);}
#rktv-controls.gone{opacity:0;pointer-events:none;transform:translateY(6px);}

#prog{margin:0 15px 10px;height:12px;display:flex;align-items:center;cursor:pointer;position:relative;}
.pt{position:relative;height:4px;width:100%;background:rgba(255,255,255,.2);border-radius:4px;transition:height .15s;}
#prog:hover .pt{height:6px;}
.pbf{position:absolute;left:0;top:0;height:100%;background:rgba(255,255,255,.4);border-radius:4px;}
.ppl{position:absolute;left:0;top:0;height:100%;background:var(--rktv-cyan);border-radius:4px;box-shadow:0 0 10px rgba(0,229,255,.5);}
.pth{position:absolute;top:50%;left:0;width:14px;height:14px;background:#fff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 2px 5px rgba(0,0,0,.5);opacity:0;transition:opacity .2s;}
#prog:hover .pth{opacity:1;}

#crow{display:flex;align-items:center;padding:0 15px;gap:12px;}
.cb{background:transparent;border:none;color:#fff;cursor:pointer;opacity:.85;transition:all .2s;display:flex;align-items:center;justify-content:center;}
.cb:hover{opacity:1;color:var(--rktv-cyan);}
.cb svg{width:22px;height:22px;fill:currentColor;}

.time-display{font-size:12px;font-family:monospace;font-weight:600;margin-left:5px;}
.csp{flex:1;}
.fit-pill{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;border:1px solid rgba(255,255,255,.5);transition:all .2s;}
.cb:hover .fit-pill{border-color:var(--rktv-cyan);color:var(--rktv-cyan);}

/* Error Overlays */
#err-ov{position:absolute;inset:0;z-index:11;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;}
#err-ov.show{display:flex;}
.ec{background:#111;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:30px;text-align:center;}
.retrybtn{background:var(--rktv-cyan);color:#000;border:none;padding:10px 20px;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:15px;}

/* Quality Selector Menu */
#qmenu{position:absolute;bottom:70px;right:15px;background:rgba(20,20,25,.95);border:1px solid rgba(0,229,255,.3);border-radius:10px;padding:8px 0;display:none;flex-direction:column;z-index:30;backdrop-filter:blur(10px);}
#qmenu.show{display:flex;}
.qopt{background:transparent;border:none;color:#fff;padding:8px 20px;font-size:12px;font-weight:600;cursor:pointer;text-align:left;}
.qopt:hover, .qopt.active{background:rgba(0,229,255,.2);color:#00e5ff;}
</style>
</head>
<body>

<div id="overlay">
  <div class="loader-core"></div>
  <p id="loadMsg">Initializing Secure Stream…</p>
</div>

<div id="status" class="ok"><span class="st-dot"></span><span id="st-txt">Ready</span></div>

<!-- Player Wrapper -->
<div id="pc">
  <div id="stream-loader">
    <div class="stream-spinner"></div>
    <div class="stream-loader-text">Loading Secure Stream...</div>
  </div>

  <video id="v" playsinline="" webkit-playsinline="" preload="none"></video>

  <div id="err-ov">
    <div class="ec">
      <div style="font-size:18px;font-weight:bold;margin-bottom:10px;">Stream Unavailable</div>
      <div style="font-size:13px;color:#aaa;margin-bottom:15px;">Could not load the secure stream link.</div>
      <button type="button" id="retryNow" class="retrybtn">Retry Now</button>
    </div>
  </div>

  <div id="qmenu"></div>

  <!-- Custom Controls UI -->
  <div id="rktv-controls" class="gone">
    <div id="prog">
      <div class="pt"><div class="pbf" id="pbuf"></div><div class="ppl" id="ppl"></div><div class="pth" id="pth"></div></div>
    </div>
    <div id="crow">
      <button class="cb" id="bplay"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" id="pico"></path></svg></button>
      <button class="cb" id="bvol"><svg viewBox="0 0 24 24" id="vico"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z" fill="currentColor"></path></svg></button>
      <span class="time-display" id="timeDisp">0:00</span>
      
      <button class="cb" id="bsettings" title="Settings / Quality">
        <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"></path></svg>
      </button>

      <button class="cb" id="bpip" title="Picture in Picture" aria-label="Picture in Picture" style="display: none;">
        <svg viewBox="0 0 24 24"><path d="M19 7H5v10h14V7zm2-2v14H3V5h18zm-2 8h-6v4h6v-4z"></path></svg>
      </button>
      
      <div class="csp"></div>
      
      <button class="cb" id="bfit"><span class="fit-pill" id="fitlbl">NORM</span></button>
      
      <button class="cb" id="bfs"><svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"></path></svg></button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

var $overlay = document.getElementById("overlay");
var $loadMsg = document.getElementById("loadMsg");
var $pc = document.getElementById("pc");
var $vid = document.getElementById("v");
var $controls = document.getElementById("rktv-controls");
var $qmenu = document.getElementById("qmenu");
var $streamLoader = document.getElementById("stream-loader");

window.playerInstance = null;
var hasInteractedForAudio = false;

function toast(msg){ 
  document.getElementById("st-txt").textContent = msg; 
  document.getElementById("status").classList.add("show"); 
  setTimeout(()=>document.getElementById("status").classList.remove("show"), 3000); 
}

function hideOverlay(){ $overlay.style.display = "none"; }

// Parse URL parameters supporting both standard query strings and custom formats
function parseParameters() {
  var search = window.location.search;
  var params = new URLSearchParams(search);
  
  var streamUrl = params.get("url");
  var drmLicense = params.get("drmLicense");

  // Fallback split parser if URL string is custom encoded
  if (!streamUrl && search.includes("url=")) {
    var sub = search.substring(1);
    var parts = sub.split("&");
    for (var i = 0; i < parts.length; i++) {
      if (parts[i].startsWith("url=")) {
        streamUrl = decodeURIComponent(parts[i].substring(4));
      }
      if (parts[i].startsWith("drmLicense=")) {
        drmLicense = decodeURIComponent(parts[i].substring(11));
      }
    }
  }

  var clearKeys = {};
  if (drmLicense) {
    var split = drmLicense.split(":");
    if (split.length >= 2) {
      clearKeys[split[0].trim().toLowerCase()] = split[1].trim().toLowerCase();
    }
  }

  return {
    url: streamUrl ? decodeURIComponent(streamUrl) : null,
    drmKeys: clearKeys
  };
}

// Picture-in-Picture Setup
var $pipBtn = document.getElementById("bpip");
if (document.pictureInPictureEnabled) {
  $pipBtn.style.display = "flex";
}
$pipBtn.onclick = async function(e) {
  e.stopPropagation();
  try {
    if (document.pictureInPictureElement) {
      await document.exitPictureInPicture();
    } else {
      await $vid.requestPictureInPicture();
    }
  } catch (err) {
    toast("PiP unavailable");
  }
};

// Mobile Touch Gestures (Volume, Brightness, Seek)
(function () {
  var startX = 0, startY = 0, startVolume = 1, startTime = 0, startBrightness = 1;
  var gesture = null, moved = false, suppressClickUntil = 0;

  $pc.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1 || e.target.closest('#crow, #qmenu, button')) return;
    var touch = e.touches[0];
    startX = touch.clientX;
    startY = touch.clientY;
    startVolume = $vid.volume;
    startTime = $vid.currentTime;
    startBrightness = parseFloat(getComputedStyle($pc).getPropertyValue('--rktv-brightness') || 1);
    gesture = null;
    moved = false;
  }, { passive: true });

  $pc.addEventListener('touchmove', function (e) {
    if (!gesture && e.touches.length !== 1) return;
    if (e.target.closest('#crow, #qmenu, button')) return;

    var touch = e.touches[0];
    var diffX = touch.clientX - startX;
    var diffY = startY - touch.clientY;

    if (!gesture) {
      if (Math.abs(diffX) < 18 && Math.abs(diffY) < 18) return;
      gesture = Math.abs(diffX) > Math.abs(diffY) ? 'seek' : (startX > window.innerWidth / 2 ? 'volume' : 'brightness');
      moved = true;
      suppressClickUntil = Date.now() + 500;
    }

    if (gesture) {
      e.preventDefault();
      if (gesture === 'volume') {
        var vol = Math.max(0, Math.min(1, startVolume + diffY / (window.innerHeight * 0.65)));
        $vid.volume = vol;
        if (vol > 0 && $vid.muted) $vid.muted = false;
        toast('🔊 Volume: ' + Math.round(vol * 100) + '%');
      } else if (gesture === 'brightness') {
        var bright = Math.max(0.3, Math.min(1, startBrightness + diffY / window.innerHeight));
        document.documentElement.style.setProperty('--rktv-brightness', bright);
        toast('☀️ Brightness: ' + Math.round(bright * 100) + '%');
      } else if (gesture === 'seek' && $vid.seekable.length) {
        var rangeEnd = $vid.seekable.end($vid.seekable.length - 1);
        var newTime = Math.max(0, Math.min(rangeEnd, startTime + (diffX / window.innerWidth) * 60));
        try { $vid.currentTime = newTime; } catch (err) {}
        toast('⏩ Seek');
      }
    }
  }, { passive: false });

  $pc.addEventListener('click', function (e) {
    if (Date.now() < suppressClickUntil) {
      e.preventDefault();
      e.stopPropagation();
    }
  }, true);
})();

// Control Visibility & Audio Unmute on Click
$pc.addEventListener('click', function(e) {
  if (e.target.closest('#crow') || e.target.closest('#qmenu')) return;
  $qmenu.classList.remove('show');
  
  if (!hasInteractedForAudio && $vid.muted) {
    $vid.muted = false;
    $vid.volume = 1;
    hasInteractedForAudio = true;
    toast("🔊 Sound Enabled");
  }
  showCtrls();
});

var hideTimer;
function showCtrls(){
  $controls.classList.remove('gone');
  clearTimeout(hideTimer);
  if (!$vid.paused) hideTimer = setTimeout(() => { $controls.classList.add('gone'); $qmenu.classList.remove('show'); }, 3500);
}
$pc.addEventListener('mousemove', showCtrls);
$pc.addEventListener('touchstart', showCtrls);

// Play/Pause & Volume UI Bindings
document.getElementById('bplay').onclick = (e) => { e.stopPropagation(); $vid.paused ? $vid.play() : $vid.pause(); };
$vid.addEventListener('play', () => { document.getElementById("pico").setAttribute("d", "M6 19h4V5H6v14zm8-14v14h4V5h-4z"); showCtrls(); });
$vid.addEventListener('pause', () => { document.getElementById("pico").setAttribute("d", "M8 5v14l11-7z"); showCtrls(); });

document.getElementById('bvol').onclick = (e) => { e.stopPropagation(); $vid.muted = !$vid.muted; };
$vid.addEventListener('volumechange', () => {
  if($vid.muted) document.getElementById("vico").innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z" fill="currentColor"/>';
  else document.getElementById("vico").innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM4 9v6h4l5 5V4L8 9H4zm15 3c0 3.2-2.05 5.92-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77v2.06c2.95.8 5 3.51 5 6.71z" fill="currentColor"/>';
});

// Quality Selector
document.getElementById('bsettings').onclick = (e) => {
  e.stopPropagation();
  $qmenu.innerHTML = '';
  if(!window.playerInstance) return;
  var tracks = window.playerInstance.getVariantTracks();
  var heights = Array.from(new Set(tracks.map(t => t.height))).filter(Boolean).sort((a,b)=>b-a);
  
  var autoBtn = document.createElement('button');
  autoBtn.className = 'qopt active';
  autoBtn.textContent = 'Auto';
  autoBtn.onclick = () => { window.playerInstance.configure({abr:{enabled:true}}); $qmenu.classList.remove('show'); toast("Quality: Auto");};
  $qmenu.appendChild(autoBtn);

  heights.forEach(h => {
    var btn = document.createElement('button');
    btn.className = 'qopt';
    btn.textContent = h + 'p';
    btn.onclick = () => {
      window.playerInstance.configure({abr:{enabled:false}});
      var t = window.playerInstance.getVariantTracks().find(tr => tr.height === h);
      if(t) window.playerInstance.selectVariantTrack(t, true);
      $qmenu.classList.remove('show');
      toast("Quality: " + h + "p");
    };
    $qmenu.appendChild(btn);
  });
  $qmenu.classList.toggle('show');
};

// Fit & Fullscreen
var FITS = ["contain","fill","cover"], fitIdx = 0;
document.getElementById('bfit').onclick = (e) => {
  e.stopPropagation();
  fitIdx = (fitIdx+1)%3;
  $vid.style.objectFit = FITS[fitIdx];
  document.getElementById('fitlbl').innerText = FITS[fitIdx] === "contain" ? "NORM" : FITS[fitIdx].toUpperCase();
};

document.getElementById('bfs').onclick = (e) => {
  e.stopPropagation();
  if(!document.fullscreenElement) { $pc.requestFullscreen().catch(()=>{}); if(screen.orientation) screen.orientation.lock('landscape').catch(()=>{}); }
  else document.exitFullscreen().catch(()=>{});
};

document.getElementById('retryNow').onclick = () => location.reload();

// Initialize Shaka Player with URL Parameters
async function initStream() {
  var config = parseParameters();
  if (!config.url) {
    $loadMsg.textContent = "Missing or invalid ?url= parameter";
    toast("Missing or invalid stream URL", "err", 0);
    return;
  }

  shaka.polyfill.installAll();
  if (!shaka.Player.isBrowserSupported()) {
    toast("Browser not supported for Shaka/DRM", "err", 0);
    return;
  }

  window.playerInstance = new shaka.Player($vid);

  // Configure DRM ClearKeys if provided in parameters
  if (Object.keys(config.drmKeys).length > 0) {
    window.playerInstance.configure({
      drm: { clearKeys: config.drmKeys }
    });
  }

  window.playerInstance.addEventListener("error", function(e) {
    console.error("Shaka Player Error:", e);
    $streamLoader.classList.add("hidden");
    document.getElementById("err-ov").classList.add("show");
  });

  try {
    $vid.muted = true;
    await window.playerInstance.load(config.url);
    hideOverlay();
    $streamLoader.classList.add("hidden");
    $vid.classList.add("video-loaded");
    toast("Ready - Tap anywhere for sound");
    $vid.play().catch(()=>{});
  } catch (err) {
    console.error("Load error:", err);
    $overlay.style.display = "none";
    $streamLoader.classList.add("hidden");
    document.getElementById("err-ov").classList.add("show");
  }
}

document.addEventListener("DOMContentLoaded", initStream);
})();
</script>
</body></html>
