<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAMAYANA - Live Stream</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080808;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.player {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    background: #000;
    overflow: hidden;
    color: white;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: #000;
}

/* TOP GRADIENT & BRANDING */
.top-gradient {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 110px;
    background: linear-gradient(
        to bottom,
        rgba(0,0,0,.75),
        transparent
    );
    pointer-events: none;
    z-index: 5;
}

.brand-title {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 30;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #D4AF37;
    text-transform: uppercase;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    pointer-events: none;
}

/* TOP BUTTONS CONTAINER */
.top-right-controls {
    position: absolute;
    top: 18px;
    right: 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 30;
}

/* TOP CONTROLS BUTTONS (Parts & Settings) */
.top-icon-btn {
    height: 44px;
    padding: 0 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;

    border: 1px solid rgba(255,255,255,.14);
    border-radius: 14px;
    background: rgba(20,20,20,.65);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    color: #fff;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;

    transition: .3s ease;
}

.top-icon-btn.settings-icon-btn {
    width: 44px;
    padding: 0;
}

.top-icon-btn svg {
    width: 21px;
    height: 21px;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: transform .55s cubic-bezier(.2,.8,.2,1);
}

.top-icon-btn:hover {
    background: rgba(212,175,55,.9);
    border-color: rgba(255,215,0,.7);
    box-shadow: 0 5px 22px rgba(212,175,55,.25);
    color: #000;
}

.top-icon-btn:hover svg {
    transform: rotate(75deg);
}

.top-icon-btn.active svg {
    transform: rotate(90deg);
}

.top-icon-btn:active {
    transform: scale(.92);
}

/* DROPDOWN MENUS */
.dropdown-menu {
    position: absolute;
    top: 60px;
    right: 0;
    width: 170px;
    padding: 10px;

    border: 1px solid rgba(255,255,255,.12);
    border-radius: 15px;

    background: rgba(17,17,17,.95);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    z-index: 40;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-8px) scale(.96);
    transform-origin: top right;

    transition:
        opacity .22s ease,
        transform .22s ease,
        visibility .22s;
}

.dropdown-menu.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
}

.menu-heading {
    font-size: 11px;
    color: #999;
    letter-spacing: 1.3px;
    text-transform: uppercase;
    padding: 3px 7px 10px;
}

.menu-option {
    width: 100%;
    padding: 10px 9px;
    border: none;
    border-radius: 9px;
    background: transparent;
    color: #ddd;
    font-size: 13px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    cursor: pointer;
    transition: .2s ease;
}

.menu-option:hover {
    background: rgba(212,175,55,.17);
    color: #fff;
}

.menu-option.selected {
    color: #D4AF37;
    background: rgba(212,175,55,.13);
    font-weight: 600;
}

.menu-option .check {
    opacity: 0;
    color: #D4AF37;
}

.menu-option.selected .check {
    opacity: 1;
}

/* CENTER PLAY BUTTON */
.center-play {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);

    width: 66px;
    height: 66px;
    border-radius: 50%;

    border: 1px solid rgba(255,255,255,.2);
    background: rgba(20,20,20,.65);
    backdrop-filter: blur(10px);

    color: white;
    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
    z-index: 10;
    transition: .25s ease;
}

.center-play:hover {
    background: rgba(212,175,55,.9);
    color: #000;
    transform: translate(-50%,-50%) scale(1.08);
}

.center-play svg {
    width: 27px;
    height: 27px;
    fill: currentColor;
}

/* BOTTOM CONTROLS */
.bottom-controls {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    padding: 35px 18px 18px;

    background: linear-gradient(
        to top,
        rgba(0,0,0,.95),
        rgba(0,0,0,.45),
        transparent
    );

    z-index: 20;
}

/* TIMELINE */
.timeline {
    width: 100%;
    height: 5px;
    background: rgba(255,255,255,.28);
    border-radius: 20px;
    position: relative;
    cursor: pointer;
    margin-bottom: 17px;
    touch-action: none;
    transition: height .15s ease;
}

.timeline-buffer {
    position: absolute;
    height: 100%;
    width: 0%;
    background: rgba(255,255,255,.35);
    border-radius: 20px;
}

.timeline-progress {
    position: absolute;
    height: 100%;
    width: 0%;
    background: #D4AF37;
    border-radius: 20px;
}

.timeline-thumb {
    position: absolute;
    top: 50%;
    left: 0%;
    width: 13px;
    height: 13px;
    background: #fff;
    border: 2px solid #D4AF37;
    border-radius: 50%;
    transform: translate(-50%,-50%) scale(0);
    transition: transform .15s ease;
    box-shadow: 0 0 8px rgba(212,175,55,.5);
}

.timeline:hover {
    height: 7px;
}

.timeline:hover .timeline-thumb,
.timeline.dragging .timeline-thumb {
    transform: translate(-50%,-50%) scale(1);
}

/* CONTROL ROW */
.control-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.left-controls,
.right-controls {
    display: flex;
    align-items: center;
    gap: 15px;
}

.control-btn {
    width: 35px;
    height: 35px;
    border: none;
    background: transparent;
    color: white;

    display: flex;
    justify-content: center;
    align-items: center;

    cursor: pointer;
    border-radius: 8px;
    transition: .2s ease;
}

.control-btn:hover {
    color: #D4AF37;
    background: rgba(255,255,255,.08);
}

.control-btn svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
}

.time-display {
    color: #ddd;
    font-size: 12px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
}

/* VOLUME */
.volume-box {
    display: flex;
    align-items: center;
    gap: 8px;
}

.volume-slider {
    width: 75px;
    height: 4px;
    appearance: none;
    background: rgba(255,255,255,.35);
    border-radius: 20px;
    cursor: pointer;
    accent-color: #D4AF37;
}

.volume-slider::-webkit-slider-thumb {
    appearance: none;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: white;
}

/* AUTO HIDE */
.top-gradient,
.top-right-controls,
.brand-title,
.bottom-controls {
    transition: opacity .3s ease;
}

.player.hide-controls .bottom-controls,
.player.hide-controls .top-gradient,
.player.hide-controls .top-right-controls,
.player.hide-controls .brand-title {
    opacity: 0;
    pointer-events: none;
}

/* RESPONSIVE */
@media (max-width: 600px) {
    .top-right-controls {
        top: 12px;
        right: 12px;
        gap: 8px;
    }

    .top-icon-btn {
        height: 40px;
        padding: 0 10px;
        border-radius: 12px;
        font-size: 12px;
    }

    .top-icon-btn.settings-icon-btn {
        width: 40px;
        padding: 0;
    }

    .brand-title {
        top: 15px;
        left: 14px;
        font-size: 14px;
    }

    .dropdown-menu {
        top: 52px;
    }

    .bottom-controls {
        padding: 30px 12px 13px;
    }

    .left-controls,
    .right-controls {
        gap: 7px;
    }

    .control-btn {
        width: 32px;
        height: 32px;
    }

    .volume-slider {
        width: 48px;
    }

    .time-display {
        font-size: 10px;
    }

    .center-play {
        width: 58px;
        height: 58px;
    }
}

@media (max-width: 360px) {
    .volume-slider {
        display: none;
    }

    .control-row {
        gap: 5px;
    }
}
</style>
</head>

                <button class="menu-option" data-part="5" data-url="https://filetolinkkk-77971a19d2f8.herokuapp.com/39802/Ramayana.2026.HQ.1080p.HDTC.Hindi-LiNE.x264-PrimeXOf.part005.mkv?hash=AgADHS">Part 5 <span class="check">✓</span></button>

    <!-- CENTER PLAY -->

<script>
const player = document.getElementById("player");
const video = document.getElementById("video");
const videoSource = document.getElementById("videoSource");

const playBtn = document.getElementById("playBtn");
const centerPlay = document.getElementById("centerPlay");

const playIcon = document.getElementById("playIcon");
const centerIcon = document.getElementById("centerIcon");

const timeline = document.getElementById("timeline");
const progress = document.getElementById("progress");
const thumb = document.getElementById("thumb");
const buffer = document.getElementById("buffer");

const currentTime = document.getElementById("currentTime");
const duration = document.getElementById("duration");

const muteBtn = document.getElementById("muteBtn");
const volumeSlider = document.getElementById("volumeSlider");
const volumeIcon = document.getElementById("volumeIcon");

const fullscreenBtn = document.getElementById("fullscreenBtn");

const settingsBtn = document.getElementById("settingsBtn");
const settingsMenu = document.getElementById("settingsMenu");

const partsBtn = document.getElementById("partsBtn");
const partsMenu = document.getElementById("partsMenu");

let isDragging = false;
let hideTimer;

/* TIME FORMAT */
function formatTime(seconds) {
    if (!Number.isFinite(seconds)) return "00:00";

    const hours = Math.floor(seconds / 3600);
    const minutes = Math.floor((seconds % 3600) / 60);
    const secs = Math.floor(seconds % 60);

    if (hours > 0) {
        return (
            String(hours).padStart(2, "0") + ":" +
            String(minutes).padStart(2, "0") + ":" +
            String(secs).padStart(2, "0")
        );
    }

    return (
        String(minutes).padStart(2, "0") + ":" +
        String(secs).padStart(2, "0")
    );
}

/* PLAY PAUSE */
function togglePlay() {
    if (video.paused) {
        video.play().catch(() => {});
    } else {
        video.pause();
    }
}

function updatePlayIcons() {
    if (video.paused) {
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        centerIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        centerPlay.style.opacity = "1";
    } else {
        playIcon.innerHTML =
            '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';

        centerIcon.innerHTML =
            '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';

        centerPlay.style.opacity = "0";
    }
}

playBtn.addEventListener("click", togglePlay);
centerPlay.addEventListener("click", togglePlay);
video.addEventListener("click", togglePlay);

video.addEventListener("play", updatePlayIcons);
video.addEventListener("pause", updatePlayIcons);

/* VIDEO TIMELINE */
video.addEventListener("loadedmetadata", () => {
    duration.textContent = formatTime(video.duration);
});

video.addEventListener("timeupdate", () => {
    if (!isDragging && video.duration) {
        const percent =
            (video.currentTime / video.duration) * 100;

        progress.style.width = percent + "%";
        thumb.style.left = percent + "%";
    }

    currentTime.textContent =
        formatTime(video.currentTime);
});

video.addEventListener("progress", () => {
    if (video.buffered.length && video.duration) {
        const bufferedEnd =
            video.buffered.end(video.buffered.length - 1);

        buffer.style.width =
            (bufferedEnd / video.duration) * 100 + "%";
    }
});

/* SEEK */
function seekToPosition(event) {
    if (!video.duration) return;

    const rect = timeline.getBoundingClientRect();

    let percent =
        (event.clientX - rect.left) / rect.width;

    percent = Math.max(0, Math.min(1, percent));

    video.currentTime = percent * video.duration;

    progress.style.width = (percent * 100) + "%";
    thumb.style.left = (percent * 100) + "%";
}

timeline.addEventListener("pointerdown", event => {
    isDragging = true;
    timeline.classList.add("dragging");

    timeline.setPointerCapture(event.pointerId);
    seekToPosition(event);
});

timeline.addEventListener("pointermove", event => {
    if (isDragging) {
        seekToPosition(event);
    }
});

function stopDragging() {
    isDragging = false;
    timeline.classList.remove("dragging");
}

timeline.addEventListener("pointerup", stopDragging);
timeline.addEventListener("pointercancel", stopDragging);

/* VOLUME */
volumeSlider.addEventListener("input", () => {
    video.volume = Number(volumeSlider.value);
    video.muted = video.volume === 0;
    updateVolumeIcon();
});

muteBtn.addEventListener("click", () => {
    video.muted = !video.muted;

    if (!video.muted && video.volume === 0) {
        video.volume = 0.5;
        volumeSlider.value = 0.5;
    }

    updateVolumeIcon();
});

function updateVolumeIcon() {
    if (video.muted || video.volume === 0) {
        volumeIcon.innerHTML =
            '<path d="m4 9 5 0 5-4v14l-5-4H4z M17 9l5 6m0-6-5 6"/>';
    } else if (video.volume < 0.5) {
        volumeIcon.innerHTML =
            '<path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12z"/>';
    } else {
        volumeIcon.innerHTML =
            '<path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12z M19 5a10 10 0 0 1 0 14"/>';
    }
}

/* PARTS SWITCHING */
partsBtn.addEventListener("click", event => {
    event.stopPropagation();
    const isOpen = partsMenu.classList.toggle("show");
    partsBtn.classList.toggle("active", isOpen);
    settingsMenu.classList.remove("show");
    settingsBtn.classList.remove("active");
});

document.querySelectorAll("#partsMenu .menu-option").forEach(option => {
    option.addEventListener("click", () => {
        const partNum = option.dataset.part;
        const partUrl = option.dataset.url;

        document.querySelectorAll("#partsMenu .menu-option")
            .forEach(item => item.classList.remove("selected"));
        option.classList.add("selected");

        partsBtn.querySelector("span").textContent = `Part ${partNum}`;

        // Change source and reload video
        const currentPlaybackTime = video.currentTime;
        const wasPlaying = !video.paused;

        videoSource.src = partUrl;
        video.load();
        
        if (wasPlaying) {
            video.play().catch(() => {});
        }

        partsMenu.classList.remove("show");
        partsBtn.classList.remove("active");
    });
});

/* SETTINGS MENU */
settingsBtn.addEventListener("click", event => {
    event.stopPropagation();
    const isOpen = settingsMenu.classList.toggle("show");
    settingsBtn.classList.toggle("active", isOpen);
    partsMenu.classList.remove("show");
    partsBtn.classList.remove("active");
});

document.querySelectorAll("#settingsMenu .menu-option").forEach(option => {
    option.addEventListener("click", () => {
        const speed = Number(option.dataset.speed);
        video.playbackRate = speed;

        document.querySelectorAll("#settingsMenu .menu-option")
            .forEach(item => item.classList.remove("selected"));
        option.classList.add("selected");

        settingsMenu.classList.remove("show");
        settingsBtn.classList.remove("active");
    });
});

/* CLOSE MENUS ON OUTSIDE CLICK */
document.addEventListener("click", event => {
    if (!partsMenu.contains(event.target) && !partsBtn.contains(event.target)) {
        partsMenu.classList.remove("show");
        partsBtn.classList.remove("active");
    }
    if (!settingsMenu.contains(event.target) && !settingsBtn.contains(event.target)) {
        settingsMenu.classList.remove("show");
        settingsBtn.classList.remove("active");
    }
});

/* FULLSCREEN & AUTO-ROTATE LANDSCAPE */
fullscreenBtn.addEventListener("click", async () => {
    try {
        if (!document.fullscreenElement) {
            if (player.requestFullscreen) {
                await player.requestFullscreen();
            } else if (player.webkitRequestFullscreen) {
                player.webkitRequestFullscreen();
            }
            
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock("landscape").catch(() => {});
            }
        } else {
            if (document.exitFullscreen) {
                await document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
            
            if (screen.orientation && screen.orientation.unlock) {
                screen.orientation.unlock();
            }
        }
    } catch (err) {
        console.log(err);
    }
});

/* AUTO HIDE CONTROLS */
function showControls() {
    player.classList.remove("hide-controls");
    clearTimeout(hideTimer);

    if (!video.paused) {
        hideTimer = setTimeout(() => {
            if (!settingsMenu.classList.contains("show") && !partsMenu.classList.contains("show")) {
                player.classList.add("hide-controls");
            }
        }, 3500);
    }
}

player.addEventListener("mousemove", showControls);
player.addEventListener("touchstart", showControls);
player.addEventListener("click", showControls);

video.addEventListener("pause", () => {
    player.classList.remove("hide-controls");
    clearTimeout(hideTimer);
});

video.addEventListener("play", showControls);

/* KEYBOARD CONTROLS */
document.addEventListener("keydown", event => {
    if (event.target.tagName === "INPUT") return;

    switch (event.code) {
        case "Space":
            event.preventDefault();
            togglePlay();
            break;

        case "ArrowRight":
            video.currentTime += 10;
            break;

        case "ArrowLeft":
            video.currentTime -= 10;
            break;

        case "ArrowUp":
            video.volume = Math.min(1, video.volume + 0.05);
            volumeSlider.value = video.volume;
            updateVolumeIcon();
            break;

        case "ArrowDown":
            video.volume = Math.max(0, video.volume - 0.05);
            volumeSlider.value = video.volume;
            updateVolumeIcon();
            break;

        case "KeyM":
            video.muted = !video.muted;
            updateVolumeIcon();
            break;

        case "KeyF":
            fullscreenBtn.click();
            break;
    }
});

/* INITIAL STATE */
updatePlayIcons();
updateVolumeIcon();
