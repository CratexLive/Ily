<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<meta name="referrer" content="no-referrer">
<title>FootxCrate — Live Sports Streaming Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@5.3.3/dist/controls.css">
<style>
:root{--cream:#F8EFD4;--olive:#5F684C;--white:#FFFFFF;--ink:#141414;--muted:#71767B;--accent:#0088cc;--border:rgba(0,0,0,.12);--surface2:#F0E4C3;--surface3:#E4D7B2;--live:#FF3355;--soon:#D48806;--done:#5C6B80;--radius:8px;--shadow:0 8px 25px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04);--shadow-deep:0 16px 40px rgba(0,0,0,.1),0 2px 8px rgba(0,0,0,.05);--display:'Space Grotesk','Inter',sans-serif;--body:'Inter',system-ui,sans-serif}
[data-theme="dark"]{--cream:#0B0C0E;--olive:#7E8F6A;--white:#141619;--ink:#F1F3F5;--muted:#8A919A;--accent:#3399ff;--border:rgba(255,255,255,.08);--surface2:#1C1F24;--surface3:#252930;--shadow:0 8px 25px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.2);--shadow-deep:0 16px 40px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.3)}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}body{font:400 14px/1.5 var(--body);color:var(--ink);background:var(--cream);min-height:100vh;padding-bottom:30px;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;position:relative}

/* Watery Fluid Flow Background Animation */
body:before{content:"";position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 30%,rgba(95,104,76,.12),transparent 45%),radial-gradient(circle at 70% 70%,rgba(0,136,204,.08),transparent 50%);animation:wateryFlow 16s ease infinite alternate;pointer-events:none;z-index:0}
@keyframes wateryFlow{0%{transform:translate(0,0) rotate(0deg) scale(1)}50%{transform:translate(-20px,15px) rotate(2deg) scale(1.02)}100%{transform:translate(15px,-20px) rotate(-2deg) scale(0.98)}}

button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;transition:transform 0.15s ease, opacity 0.15s ease}button:active{transform:scale(0.96)!important}a{color:var(--accent);text-decoration:none}img{display:block;max-width:100%}[hidden]{display:none!important}:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.container{max-width:1400px;margin:auto;padding:0 16px;position:relative;z-index:1}.view{display:none}.view.active{display:block;animation:fade .22s cubic-bezier(0.16, 1, 0.3, 1)}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Hub Header */
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;flex-wrap:wrap;border-bottom:1px solid var(--border);margin-bottom:18px;background:var(--white);margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--olive),#0088cc);color:var(--cream);display:grid;place-items:center;font-size:16px;font-weight:700}
.brand-text h1{font:700 18px/1.1 var(--display);letter-spacing:-0.2px}
.brand-text p{font-size:11px;color:var(--muted);margin-top:1px;font-weight:500}
.header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.live-pill{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;background:rgba(255,51,85,.1);border:1px solid rgba(255,51,85,.25);color:var(--live);font-size:11.5px;font-weight:600}
.live-pill .dot{width:5px;height:5px;border-radius:50%;background:var(--live);animation:pulse 1.3s infinite}@keyframes pulse{50%{opacity:.3}}
.clock{font-size:12px;color:var(--muted);font-weight:500;display:none}

.icon-action-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);display:grid;place-items:center;font-size:14px;box-shadow:var(--shadow);cursor:pointer;transition:all .2s}
.icon-action-btn:hover{border-color:var(--accent);color:var(--accent)}
.join-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;background:linear-gradient(135deg,#0088cc,#00aaff);color:#fff;font-size:12px;font-weight:700;transition:all .2s;box-shadow:0 4px 14px rgba(0,136,204,.3)}
.join-btn:hover{filter:brightness(1.06)}
.join-btn svg{width:14px;height:14px}

.search-container{margin-bottom:18px;position:relative}.search-input{width:100%;padding:12px 16px 12px 42px;background:var(--white);color:var(--ink);border:1px solid var(--border);border-radius:8px;font-size:14px;font-weight:500;box-shadow:var(--shadow);transition:all .2s}.search-input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px rgba(0,136,204,.2)}.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);pointer-events:none}

.filters{display:flex;flex-direction:column;gap:8px;padding:0 0 14px;border-bottom:1px solid var(--border);margin-bottom:18px}.filter-row{display:flex;gap:6px;overflow-x:auto;padding:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.filter-row::-webkit-scrollbar{display:none}
.pill{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--white);border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.02);transition:all .2s;white-space:nowrap}
.pill:hover{color:var(--ink);background:var(--surface2)}
.pill.active{color:var(--cream);background:var(--olive);border-color:var(--olive)}
.pill .count{font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;background:var(--surface3);color:var(--muted)}
.pill.active .count{background:rgba(255,255,255,.25);color:var(--cream)}
.pill[data-tab=live].active{color:var(--live);background:rgba(255,51,85,.15);border-color:var(--live)}
.pill[data-tab=live].active .count{background:rgba(255,51,85,.25);color:var(--live)}

/* Match Grid 1 column */
.grid{display:grid;grid-template-columns:1fr;gap:14px;padding-bottom:40px}

.card{display:flex;flex-direction:column;gap:12px;padding:16px;background:var(--white);border:1px solid var(--border);border-radius:var(--radius);text-align:left;font:inherit;color:inherit;transition:all .25s;position:relative;overflow:hidden;box-shadow:var(--shadow);width:100%}
.card:before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--olive),transparent);opacity:0;transition:opacity .2s}
.card:hover{border-color:rgba(0,0,0,.15);transform:translateY(-2px);box-shadow:var(--shadow-deep);background:var(--surface2)}
.card:hover:before{opacity:.9}
.card.is-live:before{background:linear-gradient(90deg,transparent,var(--live),transparent);opacity:.95}
.card.is-live{border-color:rgba(255,51,85,.3);box-shadow:0 8px 25px rgba(255,51,85,.06)}

.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sport-chip{font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);min-width:0}.sport-chip .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.card-main-click{background:none;border:0;width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit;display:block;padding:0}
.card-body{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:6px 0}
.team-column{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
.team-row{display:flex;align-items:center;gap:4px;justify-content:center;max-width:100%}
.team-name{font-size:12.5px;font-weight:600;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.fav-team-btn{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;padding:2px;transition:transform .2s, color .2s;flex:none;z-index:2}
.fav-team-btn:hover{transform:scale(1.25)}.fav-team-btn.active{color:var(--live)}

.crest{width:46px;height:46px;border-radius:50%;background:var(--surface3);border:1px solid var(--border);display:grid;place-items:center;overflow:hidden;position:relative;font-weight:700;font-size:12px;color:var(--muted);flex:none;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.crest img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--surface3);padding:5px}

.versus{display:flex;flex-direction:column;align-items:center;gap:2px;padding:0 4px}
.kickoff-time{font:700 15px/1 var(--display);color:var(--olive);font-variant-numeric:tabular-nums;white-space:nowrap}
.kickoff-date{font-size:10px;color:var(--muted);font-weight:500;white-space:nowrap}

.card-foot{display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--border);font-size:11.5px}
.stream-count{color:var(--muted);font-weight:500}.stream-count.empty{color:var(--live)}
.watch-cta{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:700;font-size:12px;transition:all .2s;cursor:pointer;background:none;border:0}
.watch-cta:hover{gap:6px;transform:translateX(2px)}

.status{flex:none;font-size:10px;font-weight:700;letter-spacing:.05em;padding:3px 7px;border-radius:4px;text-transform:uppercase}.status.live{color:var(--live);background:rgba(255,51,85,.1);border:1px solid rgba(255,51,85,.25)}.status.soon{color:var(--soon);background:rgba(212,136,6,.1);border:1px solid rgba(212,136,6,.25)}.status.done{color:var(--done);background:rgba(92,107,128,.1);border:1px solid rgba(92,107,128,.2)}

/* Ultra-Clean Player Header (Left Logo, Right Telegram + Dark/Light Toggle) */
.player-top-header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 12px;border-bottom:1px solid var(--border);margin-bottom:16px;background:var(--white);margin-left:-20px;margin-right:-20px;padding-left:20px;padding-right:20px;box-shadow:var(--shadow)}
.player-brand-left{display:flex;align-items:center;gap:10px}
.player-brand-left .brand-mark{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--olive),#0088cc);color:var(--cream);display:grid;place-items:center;font-size:16px;font-weight:700}
.player-brand-left h3{font:700 17px/1.1 var(--display);letter-spacing:-0.2px}

.player-right-actions{display:flex;align-items:center;gap:8px}
.player-header-tg{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#0088cc,#00aaff);color:#fff;box-shadow:0 4px 12px rgba(0,136,204,.3);transition:all .2s}
.player-header-tg:hover{filter:brightness(1.06)}
.player-header-tg svg{width:16px;height:16px;fill:currentColor}

.screen{position:relative;background:#000;border-radius:var(--radius);overflow:hidden;aspect-ratio:16/9;width:100%;max-width:min(980px,calc((100vh - 220px)*16/9));margin:0 auto;border:1px solid var(--border);box-shadow:0 20px 50px rgba(0,0,0,.3)}
#player-container{position:absolute;inset:0;background:#000;overflow:hidden}
#player-container video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.quality-toast{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.85);color:#fff;padding:6px 12px;border-radius:6px;font-size:11.5px;font-weight:600;opacity:0;transition:opacity .2s ease;pointer-events:none;z-index:10}
.quality-toast.show{opacity:1}

/* Team vs Team match header inside player view */
.player-match-showcase{display:flex;align-items:center;justify-content:center;gap:16px;padding:16px 0;max-width:980px;margin:0 auto}
.pm-team{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;text-align:center}
.pm-team .crest{width:46px;height:46px}
.pm-name{font:600 13px var(--display);color:var(--ink);overflow-wrap:anywhere}
.pm-vs{font:700 12px var(--display);color:var(--muted);text-transform:uppercase;letter-spacing:1px}

/* Compact Chhota Share Button */
.player-sub-bar{display:flex;align-items:center;justify-content:center;max-width:980px;margin:4px auto 16px;padding:0 2px}
.player-share-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:7px 14px;border-radius:6px;font-size:12px;font-weight:600;transition:all .2s;background:var(--white);color:var(--ink);border:1px solid var(--border);box-shadow:var(--shadow)}
.player-share-btn:hover{background:var(--surface2)}

.section-title{font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);max-width:980px;margin:16px auto 8px}

/* Channel / Stream Card Grid (5 columns on desktop, 2 columns on mobile/tablet) */
.streams{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;max-width:1200px;margin:0 auto}
.stream-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px 10px;background:var(--white);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);text-align:center;cursor:pointer;transition:all .2s;position:relative}
.stream-card:hover{border-color:var(--olive);background:var(--surface2);transform:translateY(-2px)}
.stream-card.active{border-color:var(--accent);background:var(--surface2);box-shadow:0 0 0 2px rgba(0,136,204,.25), var(--shadow)}
.stream-card .s-crest{width:36px;height:36px;border-radius:50%;background:var(--surface3);color:var(--muted);display:grid;place-items:center;font-weight:700;font-size:11.5px}
.stream-card .s-title{font-weight:600;font-size:12px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.stream-card .s-type{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.state{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:12px;text-align:center}.state h3{font:600 16px var(--display)}.state p{color:var(--muted);font-size:13px;max-width:400px}.err-icon{width:40px;height:40px;border-radius:8px;background:rgba(255,51,85,.1);color:var(--live);display:grid;place-items:center;font-size:18px}
.screen-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;background:#080808;color:#fff;font:600 14px var(--body);z-index:5}.screen-msg small{font-weight:400;color:#aaa;max-width:90%;overflow-wrap:anywhere}

/* Popup Styling */
.popup-overlay{position:fixed;inset:0;background:rgba(20,20,20,.75);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:20px;z-index:2147483647;opacity:0;visibility:hidden;transition:.25s}
.popup-overlay.visible{display:flex;opacity:1;visibility:visible}

.popup-wrap{width:100%;max-width:380px;padding:2px;background:linear-gradient(135deg,var(--olive),#0088cc);border-radius:12px;box-shadow:0 15px 40px rgba(0,136,204,.3)}
.popup-box{background:var(--cream);border-radius:10px;padding:32px 24px 20px;text-align:center;border:1px solid rgba(95,104,76,.2)}
.popup-title{color:var(--olive);font-family:var(--display);font-size:26px;font-weight:700;margin-bottom:6px}
.popup-text{color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:16px;font-weight:500}
.popup-text b{color:var(--ink);display:block;margin-top:4px;font-size:16px}
.popup-join{width:100%;padding:14px 16px;border-radius:8px;font:700 15px var(--body);color:#fff;background:linear-gradient(135deg,#0088cc,var(--olive));box-shadow:0 4px 15px rgba(0,136,204,.3);margin-bottom:8px}
.btn-joined-main{color:var(--muted);font-size:10px;font-weight:600;width:auto;margin:4px auto 0;padding:2px 6px;background:transparent;border:0;opacity:0.7}

@media(max-width:900px){.streams{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.container{padding:0 12px}.header{padding-top:12px;padding-bottom:12px}.screen{max-width:100%;border-radius:6px}}
</style>
</head>
<body>
<div class="popup-overlay" id="popup" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
  <div class="popup-wrap"><div class="popup-box">
    <div class="popup-title" id="popupTitle">Follow Us !!</div>
    <div class="popup-text">Join our Telegram channel<br><b>FootxCrate ™</b>For Instant Updates &amp; Exclusive Links.</div>
    <button class="popup-join" id="popupJoinBtn" type="button">JOIN NOW</button>
    <button class="btn-popup btn-joined-main" id="popupSkipBtn" type="button">No, Thanks</button>
  </div></div>
</div>

<div class="container">
<!-- Hub View (Hidden when watching stream directly) -->
<section id="hubView" class="view">
<header class="header">
  <div class="brand">
    <div class="brand-mark">FC</div>
    <div class="brand-text"><h1>FootxCrate</h1><p>Live sports streaming hub</p></div>
  </div>
  <div class="header-actions">
    <button class="icon-action-btn" id="themeToggleHub" aria-label="Toggle Theme">☀️</button>
    <div class="live-pill"><span class="dot"></span> Live</div>
    <div class="clock" id="clock"></div>
    <a class="join-btn" href="https://t.me/+lVY6VyOPZmtjOWM1" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
      <span>Telegram</span>
    </a>
  </div>
</header>
<div class="search-container"><svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input id="searchInput" class="search-input" type="search" placeholder="Search matches, teams or sports..." autocomplete="off"></div>
<div class="filters"><div class="filter-row" id="sports" role="tablist" aria-label="Sports"></div><div class="filter-row" id="tabs" role="tablist" aria-label="Status"></div></div>
<main id="list" class="grid" aria-live="polite"><div class="state"><h3>Loading events…</h3><p>Please wait while the match schedule loads.</p></div></main>
</section>

<!-- Player View -->
<section id="playerView" class="view">
  <!-- Left Top Branding & Right Top Telegram + Dark/Light Theme Toggle -->
  <div class="player-top-header">
    <div class="player-brand-left">
      <div class="brand-mark">FC</div>
      <h3>FootxCrate</h3>
    </div>
    <div class="player-right-actions">
      <a class="player-header-tg" href="https://t.me/+lVY6VyOPZmtjOWM1" target="_blank" rel="noopener" aria-label="Telegram Channel">
        <svg viewBox="0 0 24 24"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
      </a>
      <button class="icon-action-btn" id="themeTogglePlayer" aria-label="Toggle Theme">☀️</button>
    </div>
  </div>

  <!-- Video Player -->
  <div class="screen"><div id="player-container"><div class="screen-msg">Loading stream…</div></div></div>

  <!-- Team vs Team Logos & Names -->
  <div class="player-match-showcase" id="playerMatchShowcase">
    <div class="pm-team">
      <div class="crest" id="pmCrestA">?</div>
      <div class="pm-name" id="pmNameA">Team A</div>
    </div>
    <div class="pm-vs">vs</div>
    <div class="pm-team">
      <div class="crest" id="pmCrestB">?</div>
      <div class="pm-name" id="pmNameB">Team B</div>
    </div>
  </div>

  <!-- Compact Share Button -->
  <div class="player-sub-bar">
    <button class="player-share-btn" id="shareBtn" type="button">
      <svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
      <span>Share</span>
    </button>
  </div>

  <!-- Channel Grid 5 Columns -->
  <h3 class="section-title">Live Channels</h3>
  <div class="streams" id="streams"></div>
</section>
</div>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@5.3.3/dist/shaka-player.ui.min.js"></script>
<script>
"use strict";
const DATA_URLS = [
  "https://sonujson-v6.pages.dev/Data/events/allinone.json",
  "https://raw.githubusercontent.com/sm-monirulislam/Upcoming-and-Live-Sports-Data/main/Sports_data.json"
];
const TG_LINK="https://t.me/+lVY6VyOPZmtjOWM1";
const $=id=>document.getElementById(id);
const state={events:[],sport:"All",tab:"all",searchQuery:"",currentEvent:null,currentStreams:[],currentIndex:0,favsTeams:JSON.parse(localStorage.getItem("fc_fav_teams")||"[]")};
let player=null,overlay=null,playbackToken=0,toastTimer=null;

const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toggleTheme(){
 const isDark=document.documentElement.getAttribute("data-theme")==="dark";
 const next=isDark?"light":"dark";
 document.documentElement.setAttribute("data-theme",next);
 localStorage.setItem("fc_theme",next);
 const icon=next==="dark"?"☀️":"🌙";
 $("themeToggleHub").textContent=icon;
 $("themeTogglePlayer").textContent=icon;
}

function parseDate(value){
 if(!value)return null;let s=String(value).trim();if(!s||s==="null"||s==="undefined")return null;
 const ist=/\bIST\b/i.test(s);if(ist)s=s.replace(/\s*IST\s*$/i,"").trim();
 const m1=s.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})[T\s](\d{1,2}):(\d{2})(?::(\d{2}))?/);
 if(m1){const[,y,mo,d,h,mi,se="00"]=m1;const dt=new Date(`${y}-${mo.padStart(2,"0")}-${d.padStart(2,"0")}T${h.padStart(2,"0")}:${mi}:${se}${ist?"+05:30":"Z"}`);if(!isNaN(dt))return dt;}
 const m2=s.match(/^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2}):(\d{2})/);
 if(m2){const[,d,mo,y,h,mi,se]=m2;const dt=new Date(`${y}-${mo}-${d}T${h}:${mi}:${se}Z`);if(!isNaN(dt))return dt;}
 const dt=new Date(s);return isNaN(dt)?null:dt;
}

function getStatus(e){const n=Date.now();return n<e.st?"soon":n<=e.en?"live":"done"}
function duration(ms){const n=Math.max(0,Math.round(ms/60000)),h=Math.floor(n/60),m=n%60;return h>=24?`${Math.floor(h/24)}d ${h%24}h`:h?`${h}h ${m}m`:`${m}m`}
const timeString=d=>d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
const dateString=d=>d.toLocaleDateString([],{day:"numeric",month:"short"});

function crest(url,name){
 const initials=String(name||"").replace(/[^A-Za-z0-9 ]/g,"").split(/\s+/).filter(Boolean).map(x=>x[0]).join("").slice(0,2).toUpperCase()||"?";
 if(!url||url==="null")return `<div class="crest">${esc(initials)}</div>`;
 return `<div class="crest"><span>${esc(initials)}</span><img src="${esc(url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()"></div>`;
}

async function fetchJson(url){
 try{
  const res=await fetch(url,{cache:"no-store"});
  if(!res.ok)throw Error(`HTTP ${res.status}`);
  const txt=await res.text();
  if(!txt||txt.trim().startsWith("<"))throw Error("Invalid");
  return JSON.parse(txt);
 }catch(err){return null;}
}

function parseEventsFromData(data){
 const list=Array.isArray(data)?data:(Array.isArray(data?.events)?data.events:(Array.isArray(data?.matches)?data.matches:[]));
 if(!list||!Array.isArray(list))return[];
 const events=[];
 list.forEach((item)=>{
  try{
   if(!item)return;
   const info=item.event||item.eventInfo||{};
   const st=parseDate(info.startTimeIST||info.startTime||item.startTime);
   if(!st)return;
   let en=parseDate(info.endTimeIST||info.endTime||item.endTime);
   if(!en||en<=st)en=new Date(st.getTime()+3*3600000);

   const seen=new Set(),streams=[];
   const rawStreams=Array.isArray(item.streams)?item.streams:[];
   rawStreams.forEach((s,i)=>{
    if(!s)return;
    const link=String(s.stream_url||s.link||s.url||"").split("|")[0].trim();
    if(!/^https?:\/\//i.test(link)||seen.has(link))return;
    const t=String(s.type||"").toLowerCase();
    const dash=t==="dash"||/\.mpd(?:\?|$)/i.test(link);
    const hls=t==="hls"||t==="0"||/\.m3u8(?:\?|$)/i.test(link);
    if(!dash&&!hls)return;
    seen.add(link);
    
    const channelName=String(s.channel_name||s.title||s.name||`Stream ${i+1}`).trim();
    
    streams.push({
     id:channelName.toLowerCase().replace(/[^a-z0-9]/g,"_"),
     title:channelName,
     link,
     type:dash?"android":"ios",
     key:String(s.key||s.api||"").trim(),
     kid:String(s.kid||"").trim()
    });
   });

   const teamA=String(info.teamA||info.home||"");
   const teamB=String(info.teamB||info.away||"");
   const matchTitle=String(item.title||item.event_name||(teamA&&teamB?`${teamA} vs ${teamB}`:info.eventName||"Match")).trim();

   events.push({
    id:String(item.id||matchTitle.toLowerCase().replace(/[^a-z0-9]/g,"")),
    title:matchTitle,
    sport:String(item.Category||info.category||info.name||item.cat||"Other").trim(),
    comp:String(info.type||info.eventName||item.title||"").trim(),
    a:teamA,
    b:teamB,
    fa:String(info.teamAFlag||info.homeFlag||""),
    fb:String(info.teamBFlag||info.awayFlag||""),
    status:String(item.status||"").toUpperCase(),
    st,en,streams
   });
  }catch(e){}
 });
 return events;
}

async function loadData(){
 try{
  const results=await Promise.all(DATA_URLS.map(url=>fetchJson(url)));
  let allEvents=[];
  results.forEach(res=>{if(res)allEvents=allEvents.concat(parseEventsFromData(res));});

  const mergedMap=new Map();
  allEvents.forEach(ev=>{
   const key=(ev.a&&ev.b)?`${ev.a.toLowerCase()}_vs_${ev.b.toLowerCase()}`:ev.title.toLowerCase();
   if(mergedMap.has(key)){
    const existing=mergedMap.get(key);
    ev.streams.forEach(st=>{
     if(!existing.streams.some(x=>x.link===st.link)){existing.streams.push(st);}
    });
   }else{
    mergedMap.set(key,ev);
   }
  });

  state.events=Array.from(mergedMap.values());
  renderHub();
  if(!window.__booted){window.__booted=true;route();}
 }catch(e){
  const listEl = $("list");
  if(listEl) {
   listEl.innerHTML=`<div class="state"><div class="err-icon">!</div><h3>Could not load events</h3><p>Please check your connection or feed source.</p><button class="pill" id="retryLoad" type="button">Try again</button></div>`;
  }
 }
}

function renderHub(){
 if(!$("hubView").classList.contains("active")) return;
 const sportFilteredEvents=state.events.filter(e=>{
  const matchSport=state.sport==="All"||e.sport===state.sport;
  const matchQuery=!state.searchQuery||[e.a,e.b,e.comp,e.sport,e.title].some(x=>String(x||"").toLowerCase().includes(state.searchQuery));
  return matchSport&&matchQuery;
 });

 const counts={live:0,soon:0,done:0,favs:0};
 sportFilteredEvents.forEach(e=>{
  counts[getStatus(e)]++;
  if(state.favsTeams.includes(e.a)||state.favsTeams.includes(e.b)) counts.favs++;
 });

 const sports=["All",...new Set(state.events.map(e=>e.sport).filter(Boolean))];

 $("sports").innerHTML=sports.map(s=>{
  const n=s==="All"?state.events.length:state.events.filter(e=>e.sport===s).length;
  return `<button class="pill ${state.sport===s?"active":""}" data-sport="${esc(s)}" role="tab">${esc(s)}<span class="count">${n}</span></button>`;
 }).join("");

 $("tabs").innerHTML=[
  ["all","All",sportFilteredEvents.length],
  ["live","Live",counts.live],
  ["soon","Upcoming",counts.soon],
  ["favs",`⭐ Fav Teams`,state.favsTeams.length]
 ].map(([k,l,n])=>`<button class="pill ${state.tab===k?"active":""}" data-tab="${k}" role="tab">${l}<span class="count">${n}</span></button>`).join("");

 const rows=sportFilteredEvents.filter(e=>{
  if(state.tab==="live") return getStatus(e)==="live";
  if(state.tab==="soon") return getStatus(e)==="soon";
  if(state.tab==="favs") return state.favsTeams.includes(e.a)||state.favsTeams.includes(e.b);
  return true;
 }).sort((a,b)=>{const o={live:0,soon:1,done:2},d=o[getStatus(a)]-o[getStatus(b)];return d||a.st-b.st});

 $("list").innerHTML=rows.length?rows.map(eventCard).join(""):`<div class="state"><h3>No matches found</h3><p>Try another team, tournament or filter.</p></div>`;
 $("clock").textContent=new Date().toLocaleString([],{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})+" IST";
}

function eventCard(e){
 const s=getStatus(e),now=Date.now(),status=s==="live"?"Live":s==="soon"?`in ${duration(e.st-now)}`:"Finished",n=e.streams.length;
 const same=!e.b||e.a===e.b;
 const isFavA=state.favsTeams.includes(e.a);
 const isFavB=state.favsTeams.includes(e.b);

 const sideA=`<div class="team-column">${crest(e.fa,e.a||e.title)}<div class="team-row"><div class="team-name" title="${esc(e.a||e.title)}">${esc(e.a||e.title)}</div>${e.a?`<button class="fav-team-btn ${isFavA?"active":""}" data-team-fav="${esc(e.a)}" title="Favorite Team">♥</button>`:""}</div></div>`;
 const sideB=same?`<div class="team-column"></div>`:`<div class="team-column">${crest(e.fb,e.b)}<div class="team-row"><div class="team-name" title="${esc(e.b)}">${esc(e.b)}</div><button class="fav-team-btn ${isFavB?"active":""}" data-team-fav="${esc(e.b)}" title="Favorite Team">♥</button></div></div>`;

 return `<div class="card ${s==="live"?"is-live":""}">
  <div class="card-top">
    <span class="sport-chip"><span class="name">${esc(e.sport)}${e.comp?" · "+esc(e.comp):""}</span></span>
    <span class="status ${s}">${status}</span>
  </div>
  <div class="card-main-click" data-watch-event="${esc(e.id)}">
    <div class="card-body">${sideA}<div class="versus"><div class="kickoff-time">${timeString(e.st)}</div><div class="kickoff-date">${dateString(e.st)}</div></div>${sideB}</div>
  </div>
  <div class="card-foot">
    <span class="stream-count ${n?"":"empty"}">${n?`${n} stream${n>1?"s":""}`:"No streams"}</span>
    <button class="watch-cta" data-watch-event="${esc(e.id)}" type="button">Watch <span>→</span></button>
  </div>
</div>`;
}

function showToast(message,kind="info",ms=3500){
 let el=$("qualityToast");if(!el){el=document.createElement("div");el.id="qualityToast";el.className="quality-toast";$("player-container").appendChild(el)}
 el.textContent=message;el.classList.add("show");clearTimeout(toastTimer);if(ms)toastTimer=setTimeout(()=>el.classList.remove("show"),ms);
}

function getClearKey(record){
 const kid=String(record.kid||"").trim().toLowerCase();
 const key=String(record.key||"").trim().toLowerCase();
 if(kid&&key&&/^[0-9a-f]+$/.test(kid)&&/^[0-9a-f]+$/.test(key))return{keyId:kid,key};
 const raw=String(record.key||"").trim();
 if(!raw.includes(":"))return null;const p=raw.split(":");if(p.length<2)return null;
 const parsedKid=p.shift().trim().replace(/^0x/i,"").toLowerCase();
 const parsedKey=p.join(":").trim().replace(/^0x/i,"").toLowerCase();
 return /^[0-9a-f]+$/.test(parsedKid)&&/^[0-9a-f]+$/.test(parsedKey)?{keyId:parsedKid,key:parsedKey}:null;
}

async function destroyPlayer(){
 if(overlay){try{overlay.destroy()}catch(e){}overlay=null}
 if(player){try{await player.destroy()}catch(e){}player=null}
 const c=$("player-container");if(c)c.innerHTML="";
}

async function stopPlayback(){playbackToken++;await destroyPlayer()}
function showPlayerError(message,detail=""){const c=$("player-container");c.innerHTML=`<div class="screen-msg">${esc(message)}${detail?`<small>${esc(detail)}</small>`:""}</div>`}

async function mountShaka(record,token){
 if(!window.shaka)throw Error("Shaka Player library did not load.");
 shaka.polyfill.installAll();if(!shaka.Player.isBrowserSupported())throw Error("This browser does not support Shaka playback.");
 const c=$("player-container");c.innerHTML="";
 const video=document.createElement("video");video.playsInline=true;video.setAttribute("playsinline","");video.setAttribute("webkit-playsinline","");video.autoplay=true;video.preload="auto";video.controls=false;c.appendChild(video);
 const instance=new shaka.Player();player=instance;await instance.attach(video);if(token!==playbackToken)throw Error("Playback cancelled.");
 const ui=new shaka.ui.Overlay(instance,c,video);overlay=ui;
 ui.configure({controlPanelElements:["play_pause","mute","volume","time_and_duration","spacer","quality","picture_in_picture","fullscreen","overflow_menu"],overflowMenuButtons:["quality","language","captions","playback_rate","picture_in_picture"],seekBarColors:{base:"#777",buffered:"#D48806",played:"#0088cc",ad:"#fff"}});

 instance.configure({
  streaming:{
    bufferingGoal:30,
    rebufferingGoal:1,
    bufferBehind:15,
    lowLatencyMode:true,
    inaccurateManifestTolerance:0,
    retryParameters:{maxAttempts:6,baseDelay:300,fuzzFactor:.5,timeout:10000}
  },
  abr:{enabled:true,defaultBandwidthEstimate:3500000,switchInterval:1,bandwidthUpgradeTarget:0.8,bandwidthDowngradeTarget:0.9}
 });

 const ck=getClearKey(record);if(ck)instance.configure({drm:{clearKeys:{[ck.keyId]:ck.key}}});
 instance.addEventListener("error",ev=>{const e=ev.detail;console.error("Shaka error",e);if(token===playbackToken&&e?.severity===shaka.util.Error.Severity.CRITICAL)showToast("Stream playback error","",5000)});
 await instance.load(record.link);if(token!==playbackToken)return;
 try{await video.play()}catch(e){showToast("Tap Play to start the stream","",5000)}
}

async function mountNativeHls(record,token){
 const c=$("player-container");c.innerHTML="";const video=document.createElement("video");video.controls=true;video.playsInline=true;video.setAttribute("playsinline","");video.setAttribute("webkit-playsinline","");video.autoplay=true;video.preload="auto";video.src=record.link;c.appendChild(video);
 video.addEventListener("loadedmetadata",()=>{if(token!==playbackToken)return;video.play().catch(()=>showToast("Tap Play to start the stream","",4000))},{once:true});
 video.addEventListener("error",()=>{if(token!==playbackToken)return;showPlayerError("This HLS stream could not be played on this device.","The stream may be unavailable or blocked by the source server.")},{once:true});
 video.load();
}

async function mountPlayer(record,token){
 try{
  await mountShaka(record,token);
 }catch(err){
  if(token!==playbackToken)return;
  console.warn("Shaka playback failed, falling back:",err);
  await destroyPlayer();if(token!==playbackToken)return;
  if(record.type==="ios"&&/iPhone|iPad|iPod/i.test(navigator.userAgent)&&$("player-container")){
   showToast("Trying native HLS playback","",2500);
   await mountNativeHls(record,token);
  } else {
   throw err;
  }
 }
}

async function playRecord(record,index){
 if(!record)return;document.querySelectorAll("[data-player-stream-id]").forEach((b)=>{
  b.classList.toggle("active", b.dataset.playerStreamId === record.id);
 });
 const token=++playbackToken;await destroyPlayer();if(token!==playbackToken)return;
 const link=String(record.link||"").split("|")[0].trim();if(!/^https?:\/\//i.test(link)){showPlayerError("Invalid stream URL.");return}
 try{await mountPlayer({...record,link},token)}catch(e){if(token===playbackToken){console.error(e);showPlayerError("Unable to start this stream.",e.message||"Check the stream URL and browser compatibility.")}}
}

function renderPlayerStreams(activeStreamId){
 const box=$("streams");if(!state.currentStreams.length){box.innerHTML='<div class="state" style="padding:40px 20px"><p>No streams were found for this event.</p></div>';return}
 box.innerHTML=state.currentStreams.map((s)=>{
  const isActive = s.id === activeStreamId;
  const initials = s.title.replace(/[^A-Za-z0-9]/g,"").slice(0,2).toUpperCase() || "TV";
  return `<div class="stream-card ${isActive?"active":""}" data-player-stream-id="${esc(s.id)}">
    <div class="s-crest">${esc(initials)}</div>
    <div class="s-title">${esc(s.title)}</div>
    <div class="s-type">${esc(s.type)}</div>
  </div>`;
 }).join("");
}

function route(){
 const raw=location.hash.replace(/^#\/?/,"");
 const[path,query]=raw.split("?");
 const p=new URLSearchParams(query||"");

 if(path==="watch") {
  const matchId = p.get("id");
  const streamId = p.get("stream_id") || p.get("stream");
  openPlayer(matchId, streamId);
 } else {
  $("playerView").classList.remove("active");
  $("hubView").classList.add("active");
  loadData();
 }
}

async function openPlayer(id, targetStreamId){
 $("hubView").classList.remove("active");
 $("playerView").classList.add("active");
 window.scrollTo(0,0);

 if(state.events.length === 0) {
  const results=await Promise.all(DATA_URLS.map(url=>fetchJson(url)));
  let allEvents=[];
  results.forEach(res=>{if(res)allEvents=allEvents.concat(parseEventsFromData(res));});
  
  const mergedMap=new Map();
  allEvents.forEach(ev=>{
   const key=(ev.a&&ev.b)?`${ev.a.toLowerCase()}_vs_${ev.b.toLowerCase()}`:ev.title.toLowerCase();
   if(mergedMap.has(key)){
    const existing=mergedMap.get(key);
    ev.streams.forEach(st=>{
     if(!existing.streams.some(x=>x.link===st.link)){existing.streams.push(st);}
    });
   }else{
    mergedMap.set(key,ev);
   }
  });
  state.events=Array.from(mergedMap.values());
 }

 const ev=state.events.find(e=>String(e.id)===String(id));
 if(!ev){
  state.currentEvent=null;
  state.currentStreams=[];
  $("pmNameA").textContent="Match not found";
  $("pmNameB").textContent="";
  $("streams").innerHTML="";
  showPlayerError("This match is no longer available.");
  return;
 }
 
 state.currentEvent=ev;
 state.currentStreams=ev.streams||[];
 
 const teamA = ev.a || ev.title || "Team A";
 const teamB = ev.b || "";
 $("pmNameA").textContent = teamA;
 $("pmNameB").textContent = teamB;
 $("pmCrestA").outerHTML = crest(ev.fa, teamA).replace('class="crest"', 'id="pmCrestA" class="crest"');
 if(!teamB) {
  $("pmCrestB").style.display = "none";
  $("pmNameB").style.display = "none";
  document.querySelector(".pm-vs").style.display = "none";
 } else {
  $("pmCrestB").style.display = "grid";
  $("pmNameB").style.display = "block";
  document.querySelector(".pm-vs").style.display = "block";
  $("pmCrestB").outerHTML = crest(ev.fb, teamB).replace('class="crest"', 'id="pmCrestB" class="crest"');
 }

 let index = 0;
 if(targetStreamId) {
  if(/^\d+$/.test(targetStreamId)) {
   index = Math.max(0, Math.min(Number(targetStreamId), state.currentStreams.length - 1));
  } else {
   const foundIdx = state.currentStreams.findIndex(s => s.id === targetStreamId);
   if(foundIdx !== -1) index = foundIdx;
  }
 }
 state.currentIndex = index;
 
 const rec=state.currentStreams[index];
 renderPlayerStreams(rec ? rec.id : null);
 if(rec) await playRecord(rec, index); 
 else showPlayerError("No playable streams for this match.");
}

function closePopup(){$("popup").classList.remove("visible")}

document.addEventListener("DOMContentLoaded",()=>{
 const savedTheme=localStorage.getItem("fc_theme")||"dark";
 document.documentElement.setAttribute("data-theme",savedTheme);
 const icon=savedTheme==="dark"?"☀️":"🌙";
 $("themeToggleHub").textContent=icon;
 $("themeTogglePlayer").textContent=icon;

 $("themeToggleHub").addEventListener("click",toggleTheme);
 $("themeTogglePlayer").addEventListener("click",toggleTheme);

 const popup=$("popup");
 setTimeout(()=>{
  popup.classList.add("visible","button-stage");
  setTimeout(()=>{
   popup.classList.remove("button-stage");
   popup.classList.add("revealing");
   setTimeout(()=>popup.classList.remove("revealing"),400);
  },80);
 },2500);

 $("popupJoinBtn").addEventListener("click",()=>{const w=window.open(TG_LINK,"_blank","noopener");if(!w)location.href=TG_LINK;closePopup()});
 $("popupSkipBtn").addEventListener("click",closePopup);
 $("searchInput").addEventListener("input",e=>{state.searchQuery=e.target.value.toLowerCase().trim();renderHub()});
 $("shareBtn").addEventListener("click",async()=>{try{if(navigator.share)await navigator.share({title:document.title,url:location.href});else{await navigator.clipboard.writeText(location.href);showToast("Page link copied","",2000)}}catch(e){}});
});

$("list").addEventListener("click",e=>{
 const teamFavBtn=e.target.closest("[data-team-fav]");
 if(teamFavBtn){
  const team=teamFavBtn.dataset.teamFav;
  const idx=state.favsTeams.indexOf(team);
  if(idx>-1) state.favsTeams.splice(idx,1);
  else state.favsTeams.push(team);
  localStorage.setItem("fc_fav_teams",JSON.stringify(state.favsTeams));
  renderHub();
  return;
 }
 const watchTarget=e.target.closest("[data-watch-event]");
 if(watchTarget){
  const ev = state.events.find(x => String(x.id) === String(watchTarget.dataset.watchEvent));
  const firstStreamId = ev && ev.streams && ev.streams[0] ? ev.streams[0].id : "0";
  location.hash=`#watch?id=${encodeURIComponent(watchTarget.dataset.watchEvent)}&stream_id=${encodeURIComponent(firstStreamId)}`;
  return;
 }
 if(e.target.closest("#retryLoad")){loadData();return}
});

$("sports").addEventListener("click",e=>{const b=e.target.closest("[data-sport]");if(b){state.sport=b.dataset.sport;renderHub()}});
$("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b){state.tab=b.dataset.tab;renderHub()}});

$("streams").addEventListener("click",e=>{
 const b=e.target.closest("[data-player-stream-id]");
 if(!b||!state.currentEvent)return;
 const streamId=b.dataset.playerStreamId;
 const i=state.currentStreams.findIndex(s=>s.id===streamId);
 if(i===-1||!state.currentStreams[i])return;
 state.currentIndex=i;
 const selectedStream=state.currentStreams[i];
 
 history.replaceState(null,"",`#watch?id=${encodeURIComponent(state.currentEvent.id)}&stream_id=${encodeURIComponent(selectedStream.id)}`);
 playRecord(selectedStream,i);
 renderPlayerStreams(selectedStream.id);
});

window.addEventListener("hashchange",route);

if (initialHash.includes("watch?id=")) {
 route();
} else {
 loadData();
}

setInterval(()=>{
 if(window.__booted&&!location.hash.includes("watch")&&!document.hidden){loadData()}
},120000);

window.addEventListener("pagehide",()=>{stopPlayback()});
</script>
