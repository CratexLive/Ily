<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>SPORTLINK · Sony LIV</title>

  <!-- Plyr CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">

  <!-- HLS.js -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <!-- Plyr JS -->
  <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.js"></script>

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;background:#0a0a0a;overflow:hidden;
      font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
      -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

    /* Custom scrollbar */
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:#0a0a0a}
    ::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#ef4444,#f97316);border-radius:4px}

    /* Overlay */
    #overlay{position:fixed;inset:0;background:#0a0a0a;z-index:10000;
      display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
    #overlay svg{animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    #overlay p{color:#555;font-size:13px;letter-spacing:.4px;
      text-align:center;padding:0 24px;font-weight:500}

    /* Channel List */
    #channel-list{
      position:fixed;
      inset:0;
      background:#0a0a0a;
      z-index:9998;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      padding:24px 16px;
    }

    #channel-list .header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding-bottom:12px;
      border-bottom:1px solid #141414;
      flex-shrink:0;
    }
    #channel-list .header h1{
      color:#fff;
      font-size:18px;
      font-weight:700;
      letter-spacing:.5px;
      background:linear-gradient(135deg,#ef4444,#f97316,#eab308);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
    }
    #channel-list .header .subtitle{
      color:#555;
      font-size:10px;
      font-weight:400;
      letter-spacing:.8px;
      text-transform:uppercase;
      background:rgba(255,255,255,0.05);
      padding:4px 12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.05);
    }
    #channel-list .header .count{
      color:#666;
      font-size:11px;
      font-weight:500;
    }

    /* Category filter */
    #category-filter{
      display:flex;
      gap:8px;
      overflow-x:auto;
      padding:12px 0;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
      flex-shrink:0;
      border-bottom:1px solid rgba(255,255,255,0.03);
    }
    #category-filter::-webkit-scrollbar{display:none}
    .filter-pill{
      flex-shrink:0;
      padding:6px 16px;
      border-radius:20px;
      font-size:10px;
      font-weight:600;
      letter-spacing:.3px;
      text-transform:uppercase;
      cursor:pointer;
      background:#111;
      color:#666;
      border:1px solid #1a1a1a;
      transition:all .25s;
      white-space:nowrap;
    }
    .filter-pill:hover{
      background:#1a1a1a;
      color:#aaa;
      transform:translateY(-1px);
    }
    .filter-pill.active{
      background:linear-gradient(135deg,#ef4444,#f97316);
      color:#fff;
      border-color:transparent;
      box-shadow:0 4px 15px rgba(239,68,68,0.3);
    }

    /* Grid wrapper */
    #grid-wrapper{
      flex:1;
      overflow-y:auto;
      overflow-x:hidden;
      padding-top:12px;
      margin:0 -4px;
      padding-right:4px;
    }
    #grid-wrapper::-webkit-scrollbar{width:4px}
    #grid-wrapper::-webkit-scrollbar-track{background:transparent}
    #grid-wrapper::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#ef4444,#f97316);border-radius:4px}

    #ch-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
      gap:14px;
    }

    .ch-card{
      background:linear-gradient(145deg,#111,#0d0d0d);
      border:1px solid #1a1a1a;
      border-radius:14px;
      padding:16px 12px;
      cursor:pointer;
      text-decoration:none;
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      gap:10px;
      transition:all .3s cubic-bezier(.4,0,.2,1);
      -webkit-tap-highlight-color:transparent;
      min-height:130px;
      justify-content:center;
      position:relative;
      overflow:hidden;
    }
    .ch-card:hover{
      transform:translateY(-3px);
      border-color:#ef4444;
      box-shadow:0 8px 30px rgba(239,68,68,0.15);
    }
    .ch-card:active{transform:scale(.96)}

    .ch-card .category-badge{
      position:absolute;
      top:8px;
      right:8px;
      font-size:7px;
      font-weight:600;
      text-transform:uppercase;
      letter-spacing:.5px;
      padding:2px 8px;
      border-radius:8px;
      background:rgba(255,255,255,0.06);
      color:#666;
      border:1px solid rgba(255,255,255,0.04);
    }

    .ch-card .ch-logo{
      width:100%;
      max-width:110px;
      height:auto;
      max-height:55px;
      object-fit:contain;
      border-radius:6px;
      padding:4px;
    }

    .ch-card .ch-name{
      color:#e0e0e0;
      font-size:12px;
      font-weight:600;
      line-height:1.3;
      letter-spacing:.2px;
    }

    .ch-card .ch-placeholder{
      width:100%;
      max-width:110px;
      height:55px;
      background:linear-gradient(135deg,#1a1a1a,#111);
      border-radius:8px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#333;
      font-size:14px;
      font-weight:700;
      border:1px solid #1a1a1a;
    }
    .ch-card .ch-placeholder .initials{
      background:linear-gradient(135deg,#ef4444,#f97316);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
    }

    /* Player */
    #player-container{
      position:fixed;
      inset:0;
      background:#000;
      z-index:9997;
      display:none;
      align-items:center;
      justify-content:center;
    }
    #player-container video{
      width:100%;
      height:100%;
      object-fit:contain;
      background:#000;
    }
    .plyr{height:100%;width:100%;background:#000}
    .plyr__controls{background:linear-gradient(0deg,rgba(0,0,0,0.9),transparent)!important}
    .plyr__control--overlaid{background:linear-gradient(135deg,#ef4444,#f97316)!important}

    #player-container.rotate-90{
      position:fixed !important;
      top:50% !important;
      left:50% !important;
      width:100vh !important;
      height:100vw !important;
      transform:translate(-50%,-50%) rotate(90deg) !important;
      transform-origin:50% 50% !important;
      z-index:9997 !important;
    }

    .player-toolbar{
      position:fixed;
      top:14px;
      left:14px;
      z-index:9999;
      display:none;
      align-items:center;
      gap:6px;
    }
    .player-toolbar.show{display:flex}

    .rotate-btn{
      padding:6px 12px;
      background:rgba(0,0,0,0.8);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:10px;
      color:#fff;
      font-size:11px;
      font-weight:500;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:5px;
      backdrop-filter:blur(10px);
      font-family:inherit;
    }
    .rotate-btn:hover{background:rgba(239,68,68,0.2);border-color:#ef4444}
    .rotate-btn svg{width:14px;height:14px;flex-shrink:0}

    #status{
      position:fixed;
      top:14px;
      right:14px;
      z-index:9999;
      padding:5px 13px;
      background:rgba(8,8,8,.9);
      border:1px solid rgba(255,255,255,.05);
      font-size:11px;
      border-radius:20px;
      pointer-events:none;
      opacity:0;
      transition:opacity .3s;
      backdrop-filter:blur(4px);
      color:#ef4444;
    }
    #status.show{opacity:1}
  </style>
</head>
<body>

<!-- Loading Overlay -->
<div id="overlay">
  <svg width="36" height="36" viewBox="0 0 40 40" fill="none">
    <circle cx="20" cy="20" r="16" stroke="#161616" stroke-width="4"></circle>
    <path d="M20 4a16 16 0 0 1 16 16" stroke="#ef4444" stroke-width="4" stroke-linecap="round"></path>
  </svg>
  <p id="loadMsg">Loading channels…</p>
</div>

<!-- Status Toast -->
<div id="status"></div>

<!-- Player Toolbar -->
<div class="player-toolbar" id="playerToolbar">
  <button class="rotate-btn" id="rotateBtn" type="button" title="Rotate Fullscreen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
    </svg>
    <span>Rotate</span>
  </button>
</div>

<!-- Channel List -->
<div id="channel-list">
  <div class="header">
    <h1>SPORTLINK</h1>
    <span class="subtitle">Sony LIV</span>
    <span class="count">0 channels</span>
  </div>
  <div id="category-filter"></div>
  <div id="grid-wrapper">
    <div id="ch-grid"></div>
  </div>
</div>

<!-- Player Container -->
<div id="player-container">
  <video id="player" playsinline webkit-playsinline controls preload="metadata"></video>
</div>

<script>
(function(){
"use strict";

var M3U_URL = "https://sportlink-jtv.pages.dev/sony3.m3u";
var PROXY_BASE = "https://sportlink-sonyliv10.pages.dev/api/proxy?u=";

var $overlay = document.getElementById("overlay");
var $loadMsg = document.getElementById("loadMsg");
var $status = document.getElementById("status");
var $list = document.getElementById("channel-list");
var $grid = document.getElementById("ch-grid");
var $gridWrapper = document.getElementById("grid-wrapper");
var $filter = document.getElementById("category-filter");
var $playerContainer = document.getElementById("player-container");
var $video = document.getElementById("player");
var $rotateBtn = document.getElementById("rotateBtn");
var $toolbar = document.getElementById("playerToolbar");

var _stTmr = null;
var allChannels = [];
var currentCategory = 'All';
var currentPlayer = null;
var currentHls = null;
var resumeTmr = null;
var cssRotated = false;

function toast(msg, type, dur){
  $status.textContent = msg;
  $status.className = "show " + (type || "ok");
  if(_stTmr) clearTimeout(_stTmr);
  if(dur !== 0){
    _stTmr = setTimeout(function(){
      $status.className = "";
      _stTmr = null;
    }, dur || 4000);
  }
}

function setMsg(m) { if($loadMsg) $loadMsg.textContent = m; }
function hideOverlay() { if($overlay) $overlay.style.display = "none"; }
function getChId() { return new URLSearchParams(location.search).get("id") || ""; }

function proxyUrl(url){
  if(!url) return url;
  if(url.indexOf(PROXY_BASE) === 0) return url;
  return PROXY_BASE + encodeURIComponent(url);
}

function parseM3U(text){
  var channels = [];
  var lines = text.split(/\r?\n/);
  var current = null;

  for(var i=0; i<lines.length; i++){
    var line = lines[i].trim();
    if(!line) continue;

    if(line.indexOf("#EXTINF:") === 0){
      var info = line.substring(8);
      var commaIdx = info.indexOf(",");
      var name = commaIdx >= 0 ? info.substring(commaIdx+1).trim() : "Unknown";
      var attrs = commaIdx >= 0 ? info.substring(0,commaIdx) : info;

      var id = "";
      var logo = "";
      var group = "General";

      var idMatch = attrs.match(/tvg-id="([^"]*)"/i);
      if(idMatch) id = idMatch[1];

      var logoMatch = attrs.match(/tvg-logo="([^"]*)"/i) || attrs.match(/logo="([^"]*)"/i);
      if(logoMatch) logo = logoMatch[1];

      var groupMatch = attrs.match(/group-title="([^"]*)"/i);
      if(groupMatch) group = groupMatch[1] || "General";

      var safeId = id || (name.replace(/[^a-z0-9]+/gi,"_").toLowerCase() + "_" + channels.length);

      current = {
        id: safeId,
        name: name,
        logo: logo,
        category: group,
        stream_url: ""
      };
    }
    else if(line.charAt(0) === "#"){
      if(line.indexOf("#EXTGRP:") === 0 && current){
        var g = line.substring(8).trim();
        if(g) current.category = g;
      }
      continue;
    }
    else if(current){
      current.stream_url = line;
      channels.push(current);
      current = null;
    }
  }
  return channels;
}

async function loadData(){
  var r = await fetch(M3U_URL, {cache:"no-store"});
  if(!r.ok) throw new Error("HTTP " + r.status);
  var text = await r.text();
  var channels = parseM3U(text);
  return channels.filter(function(c){ return c.stream_url && c.stream_url.length > 0; });
}

function renderFilters(channels){
  var categories = ['All'];
  var cats = {};
  channels.forEach(function(ch){
    if(ch.category && ch.category !== 'General') cats[ch.category] = true;
  });
  Object.keys(cats).sort().forEach(function(c){ categories.push(c); });

  var f = document.createDocumentFragment();
  categories.forEach(function(cat){
    var pill = document.createElement('span');
    pill.className = 'filter-pill' + (cat === currentCategory ? ' active' : '');
    pill.textContent = cat;
    pill.dataset.category = cat;
    pill.addEventListener('click', function(){
      currentCategory = cat;
      document.querySelectorAll('.filter-pill').forEach(function(p){
        p.classList.toggle('active', p.dataset.category === cat);
      });
      renderChannels(channels);
      if($gridWrapper) $gridWrapper.scrollTop = 0;
    });
    f.appendChild(pill);
  });
  $filter.innerHTML = '';
  $filter.appendChild(f);
}

function renderChannels(channels){
  var filtered = currentCategory === 'All' ? channels : channels.filter(function(ch){ return ch.category === currentCategory; });
  
  var countEl = document.querySelector('.header .count');
  if(countEl) countEl.textContent = filtered.length + ' channels';

  var f = document.createDocumentFragment();
  filtered.forEach(function(ch){
    var a = document.createElement("a");
    a.className = "ch-card";
    a.href = "?id=" + encodeURIComponent(ch.id);

    var badgeHtml = (ch.category && ch.category !== 'General') ? '<span class="category-badge">'+ch.category+'</span>' : '';
    var logoHtml = (ch.logo && ch.logo.trim()) ? 
      '<img class="ch-logo" src="'+ch.logo+'" alt="'+ch.name+'" loading="lazy" onerror="this.style.display=\'none\'">' : 
      '<div class="ch-placeholder"><span class="initials">'+ch.name.slice(0,2)+'</span></div>';

    a.innerHTML = badgeHtml + logoHtml + '<span class="ch-name">'+ch.name+'</span>';
    f.appendChild(a);
  });

  $grid.innerHTML = '';
  $grid.appendChild(f);
}

function showPlayer(){
  $list.style.display = "none";
  $playerContainer.style.display = "flex";
  $toolbar.classList.add("show");
}

function isPortrait(){ return window.innerHeight > window.innerWidth; }

function applyCssRotation(on){
  $playerContainer.classList.toggle("rotate-90", !!on);
  cssRotated = !!on;
}

async function tryLockLandscape(){
  if(screen.orientation && typeof screen.orientation.lock === "function"){
    try { await screen.orientation.lock("landscape"); return true; } catch(e){}
  }
  return false;
}

async function toggleRotateFullscreen(){
  var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
  if (fsEl || cssRotated) {
    if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    applyCssRotation(false);
    if (fsEl) {
      try {
        if (document.exitFullscreen) await document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      } catch(e){}
    }
    return;
  }
  
  try {
    if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
  } catch(e){}
  
  var locked = await tryLockLandscape();
  if (!locked && isPortrait()) applyCssRotation(true);
}

if ($rotateBtn) $rotateBtn.addEventListener("click", toggleRotateFullscreen);

function setupHLSPlayer(url){
  showPlayer();
  toast("Loading stream…", "warn", 0);

  if(currentHls) { currentHls.destroy(); currentHls = null; }
  if(currentPlayer) { currentPlayer.destroy(); currentPlayer = null; }

  var playUrl = proxyUrl(url);
  var defaultOptions = { controls: ['play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'fullscreen'], autoplay: true, muted: true };

  if(Hls.isSupported() && /\.m3u8(\?|$)/i.test(url)) {
    var hls = new Hls({ autoStartLoad: true, enableWorker: true, lowLatencyMode: true });
    currentHls = hls;
    hls.loadSource(playUrl);
    hls.attachMedia($video);

    hls.on(Hls.Events.MANIFEST_PARSED, function(_, data) {
      var qualities = data.levels.map(function(l) { return l.height; }).filter(Boolean).sort(function(a,b){ return b-a; });
      currentPlayer = new Plyr($video, Object.assign({}, defaultOptions, qualities.length ? {
        quality: { default: qualities[0], options: qualities, forced: true, onChange: function(q) {
          hls.levels.forEach(function(level, index) { if(level.height === q) hls.currentLevel = index; });
        }}
      } : {}));

      $video.play().catch(function(){});
      hideOverlay();
      toast("● Live", "ok", 3000);
    });
  } else {
    $video.src = playUrl;
    currentPlayer = new Plyr($video, defaultOptions);
    $video.play().catch(function(){});
    hideOverlay();
    toast("● Live", "ok", 3000);
  }
}

async function main(){
  var id = getChId();
  try {
    setMsg("Loading channels…");
    allChannels = await loadData();
  } catch(e) {
    setMsg("Connection error.");
    toast("Connection error", "err", 0);
    return;
  }

  renderFilters(allChannels);
  renderChannels(allChannels);
  hideOverlay();

  if(id) {
    var ch = allChannels.find(function(c){ return c.id === id; });
    if(ch) {
      document.title = "SPORTLINK · " + ch.name;
      setupHLSPlayer(ch.stream_url);
    }
  }
}

document.addEventListener("DOMContentLoaded", main);
})();
</script>

<element data-item-name="ElicitationsGroup"></element>
<ElicitationsGroup message="Explore more options:">

</ElicitationsGroup>

</body>
</html>
