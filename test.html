<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style type="text/css">* {user-select: auto !important; -webkit-user-select: auto !important;}</style>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@5.2.4/dist/controls.css">

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#overlay{position:fixed;inset:0;background:#0a0a0a;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
#overlay svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#overlay p{color:#505050;font-size:12px;letter-spacing:.5px;text-align:center;padding:0 24px;font-weight:500}
#pc{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
video{width:100%;height:100%;object-fit:contain;background:#000}
video.mode-fill{object-fit:fill}
video.mode-cover{object-fit:cover}
#status{position:fixed;top:max(14px,env(safe-area-inset-top));right:12%;transform:translateY(-10px);z-index:9997;display:flex;align-items:center;gap:7px;padding:6px 15px 6px 11px;background:rgba(10,10,10,.92);border:1px solid rgba(255,255,255,.07);font-size:11.5px;font-weight:500;letter-spacing:.2px;border-radius:24px;pointer-events:none;opacity:0;transition:opacity .25s ease,transform .25s ease;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;box-shadow:0 2px 14px rgba(0,0,0,.45)}
#status.show{opacity:1;transform:translateY(0)}
.st-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}
#status.ok{color:#c0c0c0}
#status.ok .st-dot{background:#60a5fa}
#status.live{color:#c8c8c8}
#status.live .st-dot{background:#22d3a0;animation:dot-pulse 2s ease-in-out infinite}
#status.warn{color:#fcd34d}
#status.warn .st-dot{background:#fb923c;animation:dot-pulse 1s ease-in-out infinite}
#status.err{color:#fca5a5}
#status.err .st-dot{background:#f87171}
@keyframes dot-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.55)}}
.sp-btn{background:transparent!important;border:none!important;cursor:pointer!important;padding:0 8px!important;opacity:.75;display:flex;align-items:center;justify-content:center;height:100%;min-width:36px;transition:opacity .15s,color .15s;color:#fff!important;-webkit-tap-highlight-color:transparent}
.sp-btn:hover{opacity:1}
.sp-btn:active{opacity:1;transform:scale(.9)}
.sp-fit-btn{padding:0 7px!important;min-width:auto!important}
.fit-pill{font-size:10px;font-weight:700;letter-spacing:.4px;padding:3px 7px;border-radius:4px;line-height:1;border:1.5px solid rgba(255,255,255,.28);color:rgba(255,255,255,.8);pointer-events:none;white-space:nowrap}
.sp-fit-btn.mode-fill .fit-pill{border-color:#38bdf8;color:#38bdf8}
.sp-fit-btn.mode-cover .fit-pill{border-color:#a78bfa;color:#a78bfa}
.shaka-controls-container button{color:#fff!important}
.shaka-video-container{background-color:#000!important}
.shaka-spinner-container{display:none!important}
</style>
</head>
<body>

<div id="overlay">
  <svg width="34" height="34" viewBox="0 0 40 40" fill="none">
    <circle cx="20" cy="20" r="16" stroke="#1a1a1a" stroke-width="4"></circle>
    <path d="M20 4a16 16 0 0 1 16 16" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"></path>
  </svg>
  <p id="loadMsg">Missing or invalid ?url= parameter</p>
</div>

<div id="status" class="show err"><span class="st-dot"></span><span>Missing or invalid stream URL.</span></div>

<div id="pc">
  <video id="v" playsinline="" webkit-playsinline="" preload="none" autoplay="" muted="" x5-video-player-type="h5" x5-video-player-fullscreen="true"></video>
</div>

<!-- Shaka Player JS + UI -->
<script src="https://cdn.jsdelivr.net/npm/shaka-player@5.2.4/dist/shaka-player.ui.min.js"></script>

<script>
(function(){
"use strict";

var $overlay = document.getElementById("overlay");
var $loadMsg = document.getElementById("loadMsg");
var $status  = document.getElementById("status");
var $pc      = document.getElementById("pc");
var $vid     = document.getElementById("v");
var _stTmr   = null;

function getStreamInfo(){
  var params = new URLSearchParams(window.location.search);
  var urlParam = params.get("url");
  if(!urlParam) return null;

  try {
    var decodedUrl = decodeURIComponent(urlParam);
    var keysParam = params.get("keys");

    var keyId = null, key = null;
    if(keysParam){
      var decodedKeys = decodeURIComponent(keysParam);
      var keyParts = decodedKeys.split(":");
      if(keyParts.length === 2){
        keyId = keyParts[0];
        key = keyParts[1];
      }
    } else if(decodedUrl.indexOf("|") !== -1) {
      var parts = decodedUrl.split("|");
      decodedUrl = parts[0].replace(/\?$/, "");
      var keys = parts[1].split(":");
      if(keys.length === 2){
        keyId = keys[0];
        key = keys[1];
      }
    }

    return {
      streamUrl: decodedUrl,
      keyId: keyId,
      key: key
    };
  } catch(e){
    return null;
  }
}

function toast(msg, type, dur){
  $status.innerHTML = '<span class="st-dot"></span><span>' + msg + '</span>';
  $status.className = "show " + (type || "ok");
  if(_stTmr) clearTimeout(_stTmr);
  if(dur !== 0){
    _stTmr = setTimeout(function(){
      $status.className = $status.className.replace("show","").trim();
    }, dur || 4000);
  }
}

function setMsg(m){ if($loadMsg) $loadMsg.textContent = m; }
function hideOverlay(){ if($overlay) $overlay.style.display = "none"; }

async function startPlayer(){
  // Polyfill initialize
  shaka.polyfill.installAll();

  if(!shaka.Player.isBrowserSupported()){
    setMsg("Browser Not Supported.");
    toast("Browser Not Supported.", "err", 0);
    return;
  }

  var streamInfo = getStreamInfo();
  if(!streamInfo){
    setMsg("Missing or invalid ?url= parameter");
    toast("Missing or invalid stream URL.", "err", 0);
    return;
  }

  var player = new shaka.Player();
  await player.attach($vid);

  // UI Setup
  new shaka.ui.Overlay(player, $pc, $vid).configure({
    controlPanelElements: [
      "play_pause", "mute", "volume", "time_and_duration",
      "spacer", "quality", "picture_in_picture", "fullscreen", "overflow_menu"
    ]
  });

  // DRM configuration agar keys di gayi hain toh
  if(streamInfo.keyId && streamInfo.key){
    var clearKeys = {};
    clearKeys[streamInfo.keyId] = streamInfo.key;
    player.configure({ drm: { clearKeys: clearKeys } });
  }

  try {
    setMsg("Loading Stream...");
    toast("Loading Stream...", "warn", 0);
    
    // Shaka automatically handles both .mpd and .m3u8 out of the box!
    await player.load(streamInfo.streamUrl);
    
    hideOverlay();
    toast("Ready — Tap Play", "ok", 4000);

    $vid.muted = true;
    $vid.play().catch(function(){});
  } catch(e){
    console.error("Load failed:", e);
    hideOverlay();
    toast("Error loading stream", "err", 6000);
  }
}

document.addEventListener("DOMContentLoaded", startPlayer);
})();
</script>

</body></html>
